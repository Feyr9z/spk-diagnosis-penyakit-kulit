version: '3.8'

services:
  # ----------------------------------------------------
  # Service 1: App (Laravel / PHP-FPM)
  # ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spk_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - spk_network

  # ----------------------------------------------------
  # Service 2: Webserver (Nginx)
  # ----------------------------------------------------
  webserver:
    image: nginx:alpine
    container_name: spk_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - spk_network

  # ----------------------------------------------------
  # Service 3: Database (MySQL 8.0)
  # ----------------------------------------------------
  db:
    image: mysql:8.0
    container_name: spk_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: spk_kulit
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: userpassword
      MYSQL_USER: spk_user
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - spk_network

# ----------------------------------------------------
# Named Volume & Network Definition
# ----------------------------------------------------
volumes:
  dbdata:
    driver: local

networks:
  spk_network:
    driver: bridge
